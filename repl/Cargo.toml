[package]
name = "slog-repl"
version = "0.1.0"
edition = "2024"
description = "Native terminal frontend for the Slog compiler/session server"
license = "MIT"

[[bin]]
name = "slog"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"

# Already in the tree through crossterm on unix; used directly for the safe
# termios/poll calls behind terminal background detection.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "termios"] }
