<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slog Studio</title>
<link rel="stylesheet" href="/static/studio.css">
<link rel="stylesheet" href="/static/results.css">
<link rel="stylesheet" href="/static/trace.css">
<link rel="stylesheet" href="/static/hints.css">
<link rel="stylesheet" href="/static/diff.css">
<link rel="stylesheet" href="/static/assist.css">
<link rel="stylesheet" href="/static/debugger.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>
<header>
  <div class="identity">
    <select id="project" aria-label="Project"></select>
    <span id="saved" class="badge"></span>
  </div>
  <div class="controls">
    <div class="group" role="group" aria-label="Run">
      <button id="evaluate" class="primary" title="Save and evaluate the program from nothing, in a fresh session (⌘↵)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
        Run
      </button>
      <button id="debug" class="secondary" title="Run with every breakpoint armed, stopping at the first one the run reaches">
        Debug
      </button>
      <button id="bp-badge" class="icon" title="Breakpoints: every one, with its hits" hidden>
        <span class="bpg k-rule" aria-hidden="true"></span><span id="bp-count"></span>
      </button>
      <button id="stop" class="icon danger" title="Stop: pause the running command at its next slice boundary" aria-label="Stop" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg>
      </button>
    </div>
    <!-- The mode, restart, Scenarios, History and structured editing live in
         the command palette (palette.js); Review shows while proposals wait. -->
    <div class="group" role="group" aria-label="Panels">
      <button class="panel-toggle ask" data-tab="ask" aria-pressed="false" title="Ask the agent to build or change the program">✦ Ask</button>
      <button id="review-toggle" class="panel-toggle" data-tab="review" aria-pressed="false" title="Proposals: each one shows in the editor, where you accept or reject it" hidden>
        Review <span id="pending" class="count" hidden></span>
      </button>
      <button id="commands" class="icon" aria-label="Commands">⋯</button>
    </div>
    <!--account-->
  </div>
</header>
<main>
  <nav id="files" aria-label="Files">
    <div class="files-head">
      <span>Files</span>
      <button id="new-file" class="small secondary" title="Add a file to the project">New</button>
    </div>
    <div id="file-list"></div>
  </nav>
  <div id="work">
    <section id="summary" hidden></section>
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="history-chip" hidden aria-pressed="false"></button>
    </div>
    <div id="proposals" class="proposal-bar" hidden></div>
    <div id="editor"></div>
    <div id="viewer" hidden></div>
    <div id="timeline" hidden>
      <div id="viewing" hidden>
        <span id="viewing-title"></span>
        <button id="viewing-compare" class="secondary small" title="Mark the differences to another version instead">Compare with…</button>
        <button id="viewing-graph" class="secondary small" title="What the difference does to the relations and rules">Change graph</button>
        <button id="viewing-restore" class="primary small" title="Make these files current again, as a new version">Restore</button>
        <button id="viewing-branch" class="secondary small" title="Start a new branch from this version and edit there">Branch from here</button>
        <button id="viewing-back" class="secondary small" title="Return to the files you are editing">Back to head</button>
      </div>
      <div id="picking" hidden>
        <span id="picking-title"></span>
        <button id="picking-cancel" class="quiet small">Cancel</button>
      </div>
      <div id="version-graph"></div>
      <div class="timeline-row">
        <input id="timeline-slider" type="range" min="0" max="0" value="0" aria-label="Versions on this branch">
        <span id="timeline-label"></span>
        <button id="timeline-close" class="quiet small" title="Hide the history">×</button>
      </div>
    </div>
    <div id="divider" title="Drag to resize"></div>
    <section id="repl">
      <nav id="result-tabs" aria-label="Transcript and result sets"></nav>
      <div id="transcript"></div>
      <div id="results" hidden></div>
      <div id="held" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="2.6" height="10" rx=".6"/><rect x="9.4" y="3" width="2.6" height="10" rx=".6"/></svg>
        <span id="held-title"></span>
        <button data-command="continue" class="primary small" title="Resume the run">Continue</button>
        <button data-command="step into" class="secondary small calls-step" title="Into the call: stop at the first thing its rules do">Into</button>
        <button data-command="step over" class="secondary small calls-step" title="Over the call: stop when it answers">Over</button>
        <button data-command="step out" class="secondary small calls-step" title="Out: stop when the call the run is inside answers">Out</button>
        <button data-command="step" class="secondary small" title="Run to the next interpreter port">Step</button>
        <button data-command="frames" class="secondary small" title="Show the join stack and bindings here">Frames</button>
        <button data-command="abort" class="danger small" title="Discard the run; nothing is committed">Abort</button>
      </div>
      <div class="prompt-row">
        <span class="caret">›</span>
        <textarea id="prompt" rows="1" spellcheck="false" autocomplete="off"
          placeholder="?(relation X Y)   tables   :help   ?? ask the assistant (or Tab)      Enter runs once brackets balance · Shift+Enter for a new line"></textarea>
      </div>
    </section>
  </div>
  <aside id="drawer" hidden>
    <div id="ask-tab" class="tab" data-tab="ask"></div>
    <div id="review-tab" class="tab" data-tab="review"></div>
    <div class="tab" data-tab="scenarios">
      <p class="hint">Files named <code>*.scenario.toml</code> beside the program.</p>
      <div id="scenario-list"></div>
    </div>
    <div class="tab" data-tab="breakpoints">
      <p class="hint">Click a rule's margin to break when it fires; hover a rule and click a dot to break on one clause. Double-click a breakpoint to edit it.</p>
      <div id="bp-list" class="bp-list"></div>
    </div>
  </aside>
</main>
<footer id="status">
  <span id="connection" class="pill"></span>
  <span id="lane" class="pill" title="The session server and its evaluation mode: click to switch modes"></span>
  <button id="restart" class="quiet-link" title="Restart the session server (its session is discarded)" hidden>restart</button>
  <span id="session" class="pill"></span>
  <span id="evaluation" class="pill"></span>
  <span class="status-keys">
    <button id="hints" class="quiet-link" title="Hints for the form at the cursor: hold Alt+H to peek, tap to lock, Esc to unlock"></button>
    <button id="palette-key" class="quiet-link" title="Every command, by name"></button>
  </span>
</footer>
<script type="module" src="/static/main.js"></script>
</body>
</html>
