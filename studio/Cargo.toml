[package]
name = "slog-studio"
version = "0.1.0"
edition = "2024"
description = "Browser workbench for Slog programs over the compiler/session server"
license = "MIT"

[[bin]]
name = "slog-studio"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slog-repl = { path = "../repl" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
