[package]
name = "slog-studio"
version = "0.1.0"
edition = "2024"
description = "Browser workbench for Slog programs over the compiler/session server"
license = "MIT"

[[bin]]
name = "slog-studio"
path = "src/main.rs"

[dependencies]
# Server mode's password hash (Argon2id, PHC strings). RustCrypto's crate is
# the smallest maintained implementation; its BLAKE2 also digests session
# secrets, so `blake2` below adds no crate of its own.
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
blake2 = "0.11"
# Already in the tree through slog-repl; reads a password without echo.
rustix = { version = "1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slog-repl = { path = "../repl" }
toml = "0.9"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

# Argon2 is slow by design; unoptimized it is slow enough to stall a login in
# the debug build `make` installs.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
