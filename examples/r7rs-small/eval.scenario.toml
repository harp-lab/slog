# Pins what eval.slog's m-CFA concludes about its two sample programs.
# Run it with: ./slog studio scenario examples/r7rs-small/eval.scenario.toml
format = 2
id = "r7rs-small"
title = "A demand-style m-CFA over a small R7RS AST"

[program]
main = "eval.slog"

# The comments' claims, stated in Slog: `?` matches no nested values yet.
[[checks]]
name = "claims"
slog = """
table (claim str)
table (refuted str)
rule (result (Clo (Lam (Pr "id-id" _ _ _ _) _ _) _)) --> (claim "id-id returns a lambda")
rule (result (Constant (Const _ (ConstBool (False))))) --> (claim "poly returns #f")
rule (result (Constant (Const _ (ConstBool (True))))) --> (refuted "poly returns #t")
"""
empty = ["refuted", "error"]

[[steps]]
run = "?(claim C)"
expect = { rows = ['(claim "id-id returns a lambda")', '(claim "poly returns #f")'] }

[[steps]]
run = "?count (result V)"
expect = { count = 2 }

# Each program's applications are resolved: five call edges.
[[steps]]
run = "?count (calls E L)"
expect = { count = 5 }
