# Pins the call-graph verdicts analysis-demo.slog's header describes.
# Run it with: ./slog studio scenario examples/schemecfa/analysis-demo.scenario.toml
format = 2
id = "schemecfa-analysis"
title = "A call-graph query layer over m-CFA"

[program]
main = "analysis-demo.slog"

# The header's claims, stated in Slog: `?` matches no nested values yet.
[[checks]]
name = "claims"
slog = """
table (claim str)
table (refuted str)
rule (monomorphic_site (app (ref "f") a1)) (monomorphic_site (app (ref "f") a2)) (/= a1 a2)
 --> (claim "twice: both calls of f are monomorphic")
rule (inlinable_call (app (ref "f") a1) v1) (inlinable_call (app (ref "f") a2) v2) (/= a1 a2)
 --> (claim "twice: both calls of f are inlinable")
rule (polymorphic_site (app (ref "chosen") a)) --> (claim "pick: (chosen 7) is polymorphic")
rule (polymorphic_site (app (ref "f") a)) --> (refuted "twice: a call of f is polymorphic")
rule (monomorphic_site s) (polymorphic_site s) --> (refuted "a site is both monomorphic and polymorphic")
"""
empty = ["refuted", "error"]

[[steps]]
run = "?(claim C)"
expect = { rows = [
  '(claim "twice: both calls of f are monomorphic")',
  '(claim "twice: both calls of f are inlinable")',
  '(claim "pick: (chosen 7) is polymorphic")',
] }

[[steps]]
run = "?count (polymorphic_site S)"
expect = { count = 1 }

# + and - are called at primitive sites.
[[steps]]
run = '? (primitive_site S "+") (primitive_site T "-")'
expect = { exists = true }
