# Pins what kcfa.slog's worked programs P1-P6 show at k = 1.
# Run it with: ./slog studio scenario examples/kcfa/kcfa.scenario.toml
format = 2
id = "kcfa"
title = "k-CFA with higher-order environments"

[program]
main = "kcfa.slog"

# The header's claims, stated in Slog: `?` matches no nested values yet.
[[checks]]
name = "claims"
slog = """
table (claim str)
table (refuted str)
rule (program_result (boolval (ff))) --> (claim "P1, P2: eq? answers #f")
rule (program_result (boolval (tt))) --> (refuted "P1, P2: eq? answers #t")
rule (store 3 t1 (closure l e1)) (store 4 t2 (closure l e2)) (/= e1 e2)
 --> (claim "P1: g1 and g2 close over one lambda in two environments")
rule (reachable_expr (sym "live")) --> (claim "P4: the live branch is demanded")
rule (reachable_expr (sym "dead")) --> (refuted "P4: the dead branch is demanded")
rule (unique_closure (closure (lambda [42] b) e)) --> (claim "P6: the first unwinding's closure is unique")
rule (summarized_closure (closure (lambda [42] b) e)) --> (claim "P6: the self-looping frame's closure is summarized")
rule (unique_binding x t) (summarized_binding x t) --> (refuted "a binding is both unique and summarized")
"""
empty = ["refuted", "error"]

[[steps]]
run = "?(claim C)"
expect = { rows = [
  '(claim "P1, P2: eq? answers #f")',
  '(claim "P1: g1 and g2 close over one lambda in two environments")',
  '(claim "P4: the live branch is demanded")',
  '''(claim "P6: the first unwinding's closure is unique")''',
  '''(claim "P6: the self-looping frame's closure is summarized")''',
] }

# P3: fac's first unwinding binds n uniquely; its self-looping frame does not.
[[steps]]
run = "? (unique_binding 21 T)"
expect = { exists = true }

[[steps]]
run = "? (summarized_binding 21 T)"
expect = { exists = true }
