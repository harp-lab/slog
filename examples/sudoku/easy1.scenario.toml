# Pins that sudoku.slog solves the "easy1" puzzle by naked singles.
# Run it with: ./slog studio scenario examples/sudoku/easy1.scenario.toml
format = 2
id = "sudoku-easy1"
title = "Sudoku: the easy1 puzzle, solved by propagation"

[program]
main = "easy1.slog"

# A solution: one digit per cell, no digit twice among peers, clues kept.
[[checks]]
name = "a-consistent-board"
slog = """
table (two_digits int)
table (clash int int)
table (clue_lost int)
rule (solved c d) (solved c e) (/= d e) --> (two_digits c)
rule (solved c d) (peer c p) (solved p d) --> (clash c p)
rule (given c d) ~(solved c d) --> (clue_lost c)
"""
empty = ["two_digits", "clash", "clue_lost", "error"]

[[steps]]
run = "?count (solved C D)"
expect = { count = 81 }

# The top row, 5 3 4 6 7 8 9 1 2: cells 0, 1 and 4 are clues, the rest
# derived. Rows are (cell digit).
[[steps]]
run = "?(solved C D) (< C 9)"
expect = { rows = ["(0 5)", "(1 3)", "(2 4)", "(3 6)", "(4 7)", "(5 8)", "(6 9)", "(7 1)", "(8 2)"] }
