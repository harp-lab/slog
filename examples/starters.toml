[[starters]]
id = "tinycfa-mcfa-counting"
title = "1-m-CFA with abstract counting"
main = "tinycfa/mcfa-counting.slog"
about = "1-m-CFA counting the concrete bindings each abstract address stands for, over nine test programs."

[[starters]]
id = "schemecfa"
title = "m-CFA for a small Scheme"
main = "schemecfa/schemecfa.slog"
about = "Parametric m-CFA with abstract counting for a nine-form Scheme; the context depth is a fact."

[[starters]]
id = "schemecfa-analysis"
title = "Call graphs over m-CFA"
main = "schemecfa/analysis-demo.slog"
about = "A query layer over the m-CFA: resolved call graph, monomorphic and polymorphic sites, inlining."

[[starters]]
id = "kcfa"
title = "k-CFA with higher-order environments"
main = "kcfa/kcfa.slog"
about = "Shivers' k-CFA, environments as finite maps captured by closures, over five worked programs."

[[starters]]
id = "r7rs-small"
title = "m-CFA over an R7RS AST"
main = "r7rs-small/eval.slog"
